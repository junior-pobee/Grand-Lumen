name: Validate Grand-Lumen
on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["feature/global-expansion"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
