<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="description" content="Grand-Lumen is a multi-purpose digital workspace for discovery, research, worldwide news, learning, maps, creative tools and software development in a multi-language Code Lab with a live web preview." />
    <meta name="application-name" content="Grand-Lumen" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Grand-Lumen" />
    <title>Grand-Lumen — Explore Beyond</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/grand-lumen-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="%BASE_URL%icons/grand-lumen-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="%BASE_URL%icons/grand-lumen-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><div class="gl-html-startup"><img src="./icons/grand-lumen-icon.svg" alt="Grand-Lumen"/></div></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      let grandLumenStartupError = "";
      window.addEventListener("error", event => {
        const target = event.target;
        if (target && target !== window) {
          grandLumenStartupError = "Resource failed: " + (target.src || target.href || target.tagName || "unknown resource");
        } else {
          grandLumenStartupError = [event.message, event.filename, event.lineno].filter(Boolean).join(" | ");
        }
      }, true);
      window.addEventListener("unhandledrejection", event => {
        const reason = event.reason;
        grandLumenStartupError = "Unhandled rejection: " + (reason && reason.message ? reason.message : String(reason));
      });
      window.setTimeout(async () => {
        if (document.documentElement.dataset.grandLumenStarted === "true") return;
        const root = document.getElementById("root");
        if (!root) return;
        const moduleScript = document.querySelector('script[type="module"][src]');
        let assetStatus = "Not checked";
        if (moduleScript) {
          try {
            const response = await fetch(moduleScript.src, { cache: "no-store" });
            assetStatus = response.status + " " + response.statusText + " · " + (response.headers.get("content-type") || "unknown content type");
          } catch (error) {
            assetStatus = error instanceof Error ? error.message : String(error);
          }
        }
        root.innerHTML = '<main style="min-height:100vh;background:#06070d;color:#f4f6ff;display:grid;place-items:center;padding:24px;font-family:system-ui"><section style="width:min(100%,620px);padding:28px;border:1px solid #ffffff22;border-radius:18px;background:#11182a"><div style="color:#9acbff;font-size:12px;letter-spacing:3px;font-weight:800">GRAND-LUMEN DIAGNOSTICS</div><h1 style="font-size:25px">The application bundle did not start</h1><p style="color:#aab6ca;line-height:1.7">The production page is present, but the browser did not execute its application entry point.</p><p style="color:#aab6ca;line-height:1.7">Asset response: <strong id="grand-lumen-asset"></strong></p><p style="color:#aab6ca;line-height:1.7">Browser error: <strong id="grand-lumen-error"></strong></p><p style="color:#aab6ca;line-height:1.7">Bundle: <strong id="grand-lumen-url" style="overflow-wrap:anywhere"></strong></p><button onclick="window.location.reload()" style="border:0;border-radius:9px;padding:12px 18px;background:#9acbff;color:#07101e;font-weight:800">Reload Grand-Lumen</button></section></main>';
        document.getElementById("grand-lumen-asset").textContent = assetStatus;
        document.getElementById("grand-lumen-error").textContent = grandLumenStartupError || "No browser error was captured";
        document.getElementById("grand-lumen-url").textContent = moduleScript ? moduleScript.src : "No module script found";
      }, 10000);
    </script>
  </body>
</html>
