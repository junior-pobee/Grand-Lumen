<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06070d" />
    <meta name="description" content="Grand-Lumen is an expanded digital workspace for search, research, learning, coding, creativity and intelligent tools." />
    <meta name="application-name" content="Grand-Lumen" />
    <title>Grand-Lumen — Explore Beyond</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><div style="min-height:100vh;background:#06070d;color:#f4f6ff;display:grid;place-items:center;font:600 14px system-ui;letter-spacing:.12em">STARTING GRAND-LUMEN</div></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      window.setTimeout(() => {
        if (document.documentElement.dataset.grandLumenStarted === "true") return;
        const root = document.getElementById("root");
        if (!root) return;
        root.innerHTML = '<main style="min-height:100vh;background:#06070d;color:#f4f6ff;display:grid;place-items:center;padding:24px;font-family:system-ui"><section style="width:min(100%,560px);padding:28px;border:1px solid #ffffff22;border-radius:18px;background:#11182a"><div style="color:#9acbff;font-size:12px;letter-spacing:3px;font-weight:800">GRAND-LUMEN</div><h1 style="font-size:25px">The app could not start</h1><p style="color:#aab6ca;line-height:1.7">The page loaded, but its application bundle did not start. This usually means GitHub Pages is serving the wrong folder or an outdated deployment.</p><p style="color:#aab6ca;line-height:1.7">Open repository Settings → Pages and make sure Build and deployment uses GitHub Actions. Then check that the latest Deploy Grand-Lumen workflow completed successfully.</p><button onclick="window.location.reload()" style="border:0;border-radius:9px;padding:12px 18px;background:#9acbff;color:#07101e;font-weight:800">Reload Grand-Lumen</button></section></main>';
      }, 10000);
    </script>
  </body>
</html>
